<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acesso Administrativo | Nexo Varejo</title>
  
  <!-- Fontes & Ícones -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  
  <style>
    :root {
      --color-primary: #0059b5;
      --color-primary-hover: #00458f;
      --color-bg: #fcf8fb;
      --color-surface: #ffffff;
      --color-surface-low: #f6f3f5;
      --color-text-main: #1b1b1d;
      --color-text-muted: #5e5e63;
      --color-border: #e0dfe4;
      --color-error: #ba1a1a;
      --color-error-bg: #ffdad6;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.06), 0 1px 4px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--color-bg);
      color: var(--color-text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .login-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 2.5rem 2rem;
      box-shadow: var(--shadow-card);
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-logo-wrap {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      margin-bottom: 0.75rem;
    }

    .brand-logo {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--color-text-main);
    }

    .brand-badge {
      display: inline-block;
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: var(--color-surface-low);
      color: var(--color-text-muted);
      padding: 0.2rem 0.55rem;
      border-radius: 9999px;
      border: 1px solid var(--color-border);
    }

    .login-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--color-text-main);
      letter-spacing: -0.015em;
    }

    .login-subtitle {
      font-size: 0.875rem;
      color: var(--color-text-muted);
      margin-top: 0.25rem;
    }

    .alert-error {
      background: var(--color-error-bg);
      color: var(--color-error);
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--color-text-main);
      margin-bottom: 0.4rem;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 0.85rem;
      color: var(--color-text-muted);
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      height: 44px;
      padding: 0 0.85rem 0 2.5rem;
      font-family: inherit;
      font-size: 0.9375rem;
      color: var(--color-text-main);
      background: var(--color-surface-low);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      outline: none;
      transition: all 0.15s ease;
    }

    .form-input:focus {
      background: #ffffff;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(0, 89, 181, 0.15);
    }

    .btn-submit {
      width: 100%;
      height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: var(--color-primary);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      margin-top: 0.5rem;
    }

    .btn-submit:hover {
      background: var(--color-primary-hover);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .card-footer {
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--color-border);
      text-align: center;
      font-size: 0.8125rem;
      color: var(--color-text-muted);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .footer-link {
      color: var(--color-primary);
      text-decoration: none;
      font-weight: 500;
    }

    .footer-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      
      <!-- Cabeçalho Institucional -->
      <div class="brand-header">
        <div class="brand-logo-wrap">
          <span class="brand-logo">nexo</span>
          <span class="brand-badge">Varejo • Admin</span>
        </div>
        <h1 class="login-title">Acesso Operacional</h1>
        <p class="login-subtitle">Gestão de catálogo, pedidos e inventário</p>
      </div>

      <!-- Alerta de Erro se houver -->
      {% if erro %}
      <div class="alert-error" role="alert">
        <span class="material-symbols-outlined text-[20px]">error</span>
        <span>{{ erro }}</span>
      </div>
      {% endif %}

      <!-- Formulário de Autenticação Segura -->
      <form method="POST" action="/admin/login" autocomplete="off" id="form-login">
        
        <div class="form-group">
          <label for="email" class="form-label">E-mail Corporativo</label>
          <div class="input-wrapper">
            <span class="material-symbols-outlined text-[18px] input-icon">mail</span>
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              placeholder="admin@exemplo.com"
              value="{{ email or '' }}"
              required
              autofocus
            />
          </div>
        </div>

        <div class="form-group">
          <label for="senha" class="form-label">Senha de Acesso</label>
          <div class="input-wrapper">
            <span class="material-symbols-outlined text-[18px] input-icon">lock</span>
            <input
              type="password"
              id="senha"
              name="senha"
              class="form-input"
              placeholder="••••••••"
              required
            />
          </div>
        </div>

        <button type="submit" class="btn-submit" id="btn-login">
          <span class="material-symbols-outlined text-[18px]">login</span>
          <span>Entrar no Painel</span>
        </button>

      </form>

      <!-- Rodapé Seguro -->
      <div class="card-footer">
        <div>
          <span class="material-symbols-outlined text-[14px]" style="vertical-align: middle; color: var(--color-text-muted);">shield</span>
          <span>Ambiente monitorado e protegido por sessões criptografadas.</span>
        </div>
        <a href="/" class="footer-link">← Voltar para a Loja Virtual</a>
      </div>

    </div>
  </div>

</body>
</html>
